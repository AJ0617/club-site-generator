<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{metaDescription}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="{{fontLinkHref}}" rel="stylesheet">
    <link rel="stylesheet" href="app-shell.css">
    {{themeOverrideStyle}}
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <span class="sidebar-brand">{{clubName}}</span>
        </div>
        <nav class="sidebar-nav">
            <button class="sidebar-item" data-tab="home" type="button">
                <span class="sidebar-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
                </span>
                <span class="sidebar-label">Home</span>
            </button>
            <button class="sidebar-item" data-tab="events" type="button">
                <span class="sidebar-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                </span>
                <span class="sidebar-label">Events</span>
            </button>
            <button class="sidebar-item" data-tab="members" type="button">
                <span class="sidebar-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.6"/><path d="M15 20a5 5 0 0 1 7-4.6"/></svg>
                </span>
                <span class="sidebar-label">Members</span>
            </button>
            <button class="sidebar-item" data-tab="gallery" type="button">
                <span class="sidebar-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="10" r="1.7"/><path d="M21 16l-5.5-5.5a1.5 1.5 0 0 0-2.1 0L4 19"/></svg>
                </span>
                <span class="sidebar-label">Gallery</span>
            </button>
            <button class="sidebar-item" data-tab="more" type="button">
                <span class="sidebar-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
                </span>
                <span class="sidebar-label">More</span>
            </button>
        </nav>
    </aside>

    <main class="tab-content" id="tab-content">
        <div class="tab-panel" data-tab-panel="home">
            {{homeTabContent}}
        </div>
        <div class="tab-panel" data-tab-panel="events">
            {{eventsTabContent}}
        </div>
        <div class="tab-panel" data-tab-panel="members">
            {{membersTabContent}}
        </div>
        <div class="tab-panel" data-tab-panel="gallery">
            {{galleryTabContent}}
        </div>
        <div class="tab-panel" data-tab-panel="more">
            {{moreTabContent}}
        </div>

        <footer class="app-footer">
            <p>&copy; {{year}} {{clubName}}. Built with the <a href="https://github.com/Site-Generator">site generator</a>.</p>
        </footer>
    </main>
</div>

<script>
    (function () {
        var TABS = ['home', 'events', 'members', 'gallery', 'more'];
        var panels = {};
        var navItems = {};
        TABS.forEach(function (t) {
            panels[t] = document.querySelector('[data-tab-panel="' + t + '"]');
            navItems[t] = document.querySelector('[data-tab="' + t + '"]');
        });

        function activate(tab) {
            if (TABS.indexOf(tab) === -1) tab = 'home';
            TABS.forEach(function (t) {
                var isActive = t === tab;
                if (panels[t]) panels[t].classList.toggle('is-active', isActive);
                if (navItems[t]) {
                    navItems[t].classList.toggle('is-active', isActive);
                    if (isActive) navItems[t].setAttribute('aria-current', 'page');
                    else navItems[t].removeAttribute('aria-current');
                }
            });
            history.replaceState(null, '', '#' + tab);
            window.scrollTo(0, 0);
        }

        TABS.forEach(function (t) {
            if (navItems[t]) {
                navItems[t].addEventListener('click', function () { activate(t); });
            }
        });

        // One delegated listener covers every "jump to tab" control
        // (teaser "See all", hero/More "Join Us") without per-element wiring.
        document.addEventListener('click', function (e) {
            var el = e.target.closest('[data-tab-target]');
            if (!el) return;
            e.preventDefault();
            activate(el.getAttribute('data-tab-target'));
        });

        var toggle = document.getElementById('sidebar-toggle');
        if (toggle) {
            toggle.addEventListener('click', function () {
                document.body.classList.toggle('nav-collapsed');
            });
        }

        var initial = (location.hash || '').replace('#', '');
        activate(initial || 'home');
    })();
</script>

</body>
</html>
